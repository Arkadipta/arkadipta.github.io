    homeInfoParams:
        Title: 👋🏼 Hi there,
        subtitle: "**welcome to my homepage...**"
        Content: |
          I am a quantitative researcher focused on alpha signal development for systematic trading strategies. 
          My background is in astrophysics, with a PhD from the Tata Institute of Fundamental Research (TIFR), Mumbai. 
          Prior to my current role, I worked as a postdoctoral scientist at DESY, contributing to software development 
          and simulation frameworks for the Cherenkov Telescope Array.

          In my earlier research, I specialized in the study of high-energy emissions from supermassive black holes, 
          applying methods from time-series analysis, causal inference, and statistical learning. I’ve also contributed 
          to the control software of multiple international observatories.

          My core interests lie in statistical modeling, time-series forecasting, and working with large, complex datasets.

